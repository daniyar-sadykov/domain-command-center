[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "domain-command-center"
version = "1.0.0"
description = "Async CLI pipeline that enriches domain lists with public signals and scores them for outreach"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4.0"]

[project.scripts]
enrich = "enrich:main"

